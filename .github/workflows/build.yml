name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Run Cargo tests
        run: cargo test
        working-directory: src-tauri

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # The suite runs against the Vite test harness (no Tauri backend);
        # playwright.config.ts starts the dev:test server on port 1421.
        run: npx playwright test

      - name: Build Tauri app
        run: npx tauri build
        env:
          # PRs from forks do not receive secrets; `tauri build` still succeeds
          # without them because createUpdaterArtifacts is false. Release
          # signing happens only in release.yml.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
